<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFD"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="0" r="320" fill="#5057EA" opacity="0.04"/>
  <circle cx="1200" cy="630" r="340" fill="#C2410C" opacity="0.05"/>
  <circle cx="1180" cy="40" r="14" fill="#A5D549" opacity="0.7"/>
  <circle cx="60" cy="580" r="10" fill="#5057EA" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#C2410C"/>

  <!-- Brand tag -->
  <rect x="70" y="64" width="168" height="40" rx="20" fill="#E86020"/>
  <text x="154" y="89" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">TRAVEL GUIDE</text>

  <text x="70" y="90" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#9AA6B2">BLOG &bull;</text>

  <!-- Title -->
  <text x="70" y="196" font-family="Arial" font-size="52" font-weight="800" fill="#031B30">Mexico Tourist</text>
  <text x="70" y="282" font-family="Arial" font-size="52" font-weight="800" fill="#C2410C">Visa 2026</text>

  <!-- Subtitle -->
  <text x="70" y="352" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Complete Guide for</text>
  <text x="70" y="390" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Indians 2026</text>

  <!-- Date badge -->
  <rect x="70" y="508" width="308" height="54" rx="27" fill="#FFFFFF" stroke="#E0E6F2" stroke-width="2" filter="url(#shadowSoft)"/>
  <circle cx="92" cy="535" r="7" fill="#A5D549"/>
  <text x="112" y="541" font-family="Arial" font-size="20" font-weight="700" fill="#5057EA">UPDATED SEP 2026</text>
  <text x="1070" y="588" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#C3CCD9">MY VISA ASSISTANCE</text>

  <!-- Visual: travel globe -->
  <g filter="url(#shadow)">
    <rect x="700" y="112" width="430" height="406" rx="36" fill="#FFFFFF"/>
  </g>

  <!-- Route arc -->
  <path d="M790 470 C 845 370 945 290 1040 250" fill="none" stroke="#5057EA" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
  <circle cx="790" cy="470" r="7" fill="#5057EA"/>

  <!-- Globe -->
  <circle cx="915" cy="305" r="118" fill="#FFF9F2" stroke="#C2410C" stroke-width="9"/>
  <ellipse cx="915" cy="305" rx="52" ry="118" fill="none" stroke="#C2410C" stroke-width="4" opacity="0.7"/>
  <line x1="800" y1="305" x2="1030" y2="305" stroke="#C2410C" stroke-width="4" opacity="0.7"/>

  <!-- Landmass -->
  <path d="M855 245 C 882 228 902 232 908 252 C 914 272 903 286 884 283 C 867 280 850 268 855 245 Z" fill="#C2410C" opacity="0.25"/>
  <path d="M950 292 C 978 280 1006 296 999 318 C 992 338 964 342 948 327 C 936 315 936 305 950 292 Z" fill="#C2410C" opacity="0.25"/>
  <path d="M862 340 C 880 330 900 338 895 356 C 891 372 872 372 858 360 C 849 351 851 344 862 340 Z" fill="#C2410C" opacity="0.25"/>

  <!-- Location pin -->
  <circle cx="1033" cy="238" r="18" fill="#E86020"/>
  <circle cx="1033" cy="238" r="6" fill="#FFFFFF"/>
  <path d="M1016 264 L1033 296 L1050 264 Z" fill="#E86020"/>
  <circle cx="1033" cy="296" r="4" fill="#5057EA"/>

  <!-- Compass + nodes -->
  <path d="M850 155 L865 172 L850 189" fill="none" stroke="#C2410C" stroke-width="3" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="828" cy="175" r="5" fill="#A5D549"/>

</svg>