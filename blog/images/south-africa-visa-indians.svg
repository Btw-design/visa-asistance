<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFD"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="0" r="320" fill="#5057EA" opacity="0.04"/>
  <circle cx="1200" cy="630" r="340" fill="#15803D" opacity="0.05"/>
  <circle cx="1180" cy="40" r="14" fill="#A5D549" opacity="0.7"/>
  <circle cx="60" cy="580" r="10" fill="#5057EA" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#15803D"/>

  <!-- Brand tag -->
  <rect x="70" y="64" width="168" height="40" rx="20" fill="#E86020"/>
  <text x="154" y="89" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">TRAVEL GUIDE</text>

  <text x="70" y="90" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#9AA6B2">BLOG &bull;</text>

  <!-- Title -->
  <text x="70" y="196" font-family="Arial" font-size="52" font-weight="800" fill="#031B30">South Africa</text>
  <text x="70" y="282" font-family="Arial" font-size="52" font-weight="800" fill="#15803D">Tourist Visa</text>

  <!-- Subtitle -->
  <text x="70" y="352" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Documents, Fees &amp;</text>
  <text x="70" y="390" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Processing Time</text>

  <!-- Date badge -->
  <rect x="70" y="508" width="308" height="54" rx="27" fill="#FFFFFF" stroke="#E0E6F2" stroke-width="2" filter="url(#shadowSoft)"/>
  <circle cx="92" cy="535" r="7" fill="#A5D549"/>
  <text x="112" y="541" font-family="Arial" font-size="20" font-weight="700" fill="#5057EA">UPDATED SEP 2026</text>
  <text x="1070" y="588" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#C3CCD9">MY VISA ASSISTANCE</text>

  <!-- Visual: safari sunset -->
  <g filter="url(#shadow)">
    <rect x="700" y="112" width="430" height="406" rx="36" fill="#FFFFFF"/>
  </g>

  <!-- Sun -->
  <circle cx="915" cy="250" r="68" fill="#E86020" opacity="0.6"/>
  <circle cx="915" cy="250" r="52" fill="#E86020" opacity="0.45"/>

  <!-- Birds -->
  <path d="M972 152 C 979 146 987 146 994 152" fill="none" stroke="#031B30" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M1006 140 C 1012 136 1018 136 1024 140" fill="none" stroke="#031B30" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>

  <!-- Acacia tree -->
  <path d="M915 386 L915 466" fill="none" stroke="#031B30" stroke-width="10" stroke-linecap="round"/>
  <path d="M915 388 C 880 378 838 382 803 392" fill="none" stroke="#031B30" stroke-width="7" stroke-linecap="round"/>
  <path d="M915 388 C 952 378 994 382 1027 392" fill="none" stroke="#031B30" stroke-width="7" stroke-linecap="round"/>
  <path d="M768 392 C 796 352 1034 352 1062 392 C 1030 406 988 410 915 410 C 842 410 800 406 768 392 Z" fill="#031B30"/>

  <!-- Giraffe silhouette -->
  <g stroke="#031B30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M736 432 C 750 426 792 426 812 434" fill="none" stroke-width="30"/>
    <path d="M808 428 C 810 400 811 372 812 342" fill="none" stroke-width="16"/>
    <path d="M812 342 L842 334" fill="none" stroke-width="15"/>
    <path d="M820 336 L822 322" stroke-width="4"/>
    <path d="M838 330 L840 316" stroke-width="4"/>
    <path d="M826 334 C 829 324 836 325 835 331" fill="#031B30" stroke-width="2"/>
    <path d="M776 452 L776 470" stroke-width="11"/>
    <path d="M792 450 L792 470" stroke-width="11"/>
    <path d="M746 450 L746 470" stroke-width="11"/>
    <path d="M736 432 C 726 438 720 444 718 450" fill="none" stroke-width="4"/>
  </g>

  <!-- Ground -->
  <path d="M700 476 Q 915 464 1130 476" fill="none" stroke="#031B30" stroke-width="5" stroke-linecap="round"/>

</svg>