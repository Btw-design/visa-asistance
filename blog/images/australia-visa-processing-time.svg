<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFD"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="630" r="300" fill="#0891B2" opacity="0.05"/>
  <circle cx="1200" cy="0" r="320" fill="#5057EA" opacity="0.04"/>
  <circle cx="60" cy="60" r="14" fill="#0891B2" opacity="0.7"/>
  <circle cx="1140" cy="590" r="10" fill="#A5D549" opacity="0.6"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#0891B2"/>

  <!-- Brand tag -->
  <rect x="70" y="64" width="168" height="40" rx="20" fill="#E86020"/>
  <text x="154" y="89" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">TRAVEL GUIDE</text>

  <text x="70" y="90" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#9AA6B2">BLOG &bull;</text>

  <!-- Title -->
  <text x="70" y="196" font-family="Arial" font-size="52" font-weight="800" fill="#031B30">Australia Tourist Visa</text>
  <text x="70" y="282" font-family="Arial" font-size="52" font-weight="800" fill="#0891B2">Processing Time</text>

  <!-- Subtitle -->
  <text x="70" y="352" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">How Long Does It</text>
  <text x="70" y="390" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Really Take?</text>

  <!-- Date badge -->
  <rect x="70" y="508" width="308" height="54" rx="27" fill="#FFFFFF" stroke="#E0E6F2" stroke-width="2" filter="url(#shadowSoft)"/>
  <circle cx="92" cy="535" r="7" fill="#A5D549"/>
  <text x="112" y="541" font-family="Arial" font-size="20" font-weight="700" fill="#5057EA">UPDATED SEP 2026</text>
  <text x="1070" y="588" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#C3CCD9">MY VISA ASSISTANCE</text>

  <!-- Visual: clock card -->
  <g filter="url(#shadow)">
    <rect x="700" y="112" width="430" height="406" rx="36" fill="#FFFFFF"/>
  </g>

  <!-- Clock -->
  <circle cx="915" cy="290" r="132" fill="#F1FAFE"/>
  <circle cx="915" cy="290" r="132" fill="none" stroke="#0891B2" stroke-width="14"/>

  <!-- Tick marks -->
  <g stroke="#0891B2" stroke-width="5" stroke-linecap="round">
    <line x1="915" y1="172" x2="915" y2="188"/>
    <line x1="915" y1="392" x2="915" y2="408"/>
    <line x1="797" y1="290" x2="813" y2="290"/>
    <line x1="1017" y1="290" x2="1033" y2="290"/>
  </g>

  <!-- Hands -->
  <line x1="915" y1="290" x2="915" y2="196" stroke="#031B30" stroke-width="12" stroke-linecap="round"/>
  <line x1="915" y1="290" x2="1000" y2="260" stroke="#0891B2" stroke-width="10" stroke-linecap="round"/>
  <circle cx="915" cy="290" r="16" fill="#E86020"/>
  <circle cx="915" cy="290" r="6" fill="#FFFFFF"/>

  <!-- Label -->
  <rect x="795" y="448" width="240" height="52" rx="26" fill="#0891B2"/>
  <text x="915" y="481" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#FFFFFF">~20 DAYS TYPICALLY</text>

</svg>