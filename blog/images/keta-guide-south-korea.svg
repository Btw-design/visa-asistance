<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFD"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="0" r="320" fill="#7C3AED" opacity="0.05"/>
  <circle cx="1200" cy="630" r="300" fill="#5057EA" opacity="0.04"/>
  <circle cx="1120" cy="60" r="13" fill="#7C3AED" opacity="0.7"/>
  <circle cx="70" cy="570" r="9" fill="#A5D549" opacity="0.6"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#7C3AED"/>

  <!-- Brand tag -->
  <rect x="70" y="64" width="168" height="40" rx="20" fill="#E86020"/>
  <text x="154" y="89" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">TRAVEL GUIDE</text>

  <text x="70" y="90" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#9AA6B2">BLOG &bull;</text>

  <!-- Title -->
  <text x="70" y="190" font-family="Arial" font-size="72" font-weight="900" fill="#7C3AED">K-ETA</text>
  <text x="70" y="276" font-family="Arial" font-size="52" font-weight="800" fill="#031B30">for Indians</text>

  <!-- Subtitle -->
  <text x="70" y="350" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Complete Guide to South Korea's</text>
  <text x="70" y="388" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Electronic Travel Auth</text>

  <!-- Date badge -->
  <rect x="70" y="508" width="308" height="54" rx="27" fill="#FFFFFF" stroke="#E0E6F2" stroke-width="2" filter="url(#shadowSoft)"/>
  <circle cx="92" cy="535" r="7" fill="#A5D549"/>
  <text x="112" y="541" font-family="Arial" font-size="20" font-weight="700" fill="#5057EA">UPDATED SEP 2026</text>
  <text x="1070" y="588" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#C3CCD9">MY VISA ASSISTANCE</text>

  <!-- Visual: phone card -->
  <g filter="url(#shadow)">
    <rect x="700" y="112" width="430" height="406" rx="36" fill="#FFFFFF"/>
  </g>

  <!-- Phone -->
  <rect x="785" y="138" width="260" height="362" rx="34" fill="#1C2534"/>
  <rect x="793" y="146" width="244" height="346" rx="27" fill="#F4F6FA"/>
  <rect x="863" y="156" width="104" height="14" rx="7" fill="#1C2534"/>

  <!-- Screen: status -->
  <text x="915" y="212" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#5A6B7B">KOREA E-TRAVEL</text>

  <!-- Shield + check -->
  <circle cx="915" cy="300" r="58" fill="#7C3AED"/>
  <path d="M915 258 L945 274 L945 302 C945 330 933 346 915 356 C897 346 885 330 885 302 L885 274 Z" fill="#FFFFFF" opacity="0.2"/>
  <path d="M895 300 L909 314 L937 282" fill="none" stroke="#A5D549" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="915" y="400" text-anchor="middle" font-family="Arial" font-size="26" font-weight="900" fill="#031B30">APPROVED</text>
  <text x="915" y="430" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#7C3AED">E-TRAVEL AUTHORITY</text>

  <!-- Badge -->
  <rect x="815" y="452" width="200" height="44" rx="22" fill="#7C3AED"/>
  <text x="915" y="480" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">90-DAY STAY</text>

</svg>