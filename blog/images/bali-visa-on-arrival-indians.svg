<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFD"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="0" r="320" fill="#5057EA" opacity="0.04"/>
  <circle cx="1200" cy="630" r="340" fill="#F97316" opacity="0.05"/>
  <circle cx="1180" cy="40" r="14" fill="#A5D549" opacity="0.7"/>
  <circle cx="60" cy="580" r="10" fill="#5057EA" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#F97316"/>

  <!-- Brand tag -->
  <rect x="70" y="64" width="168" height="40" rx="20" fill="#E86020"/>
  <text x="154" y="89" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">TRAVEL GUIDE</text>

  <text x="70" y="90" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#9AA6B2">BLOG &bull;</text>

  <!-- Title -->
  <text x="70" y="196" font-family="Arial" font-size="52" font-weight="800" fill="#031B30">Bali Visa</text>
  <text x="70" y="282" font-family="Arial" font-size="52" font-weight="800" fill="#F97316">on Arrival</text>

  <!-- Subtitle -->
  <text x="70" y="352" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Complete Guide for</text>
  <text x="70" y="390" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Indian Tourists</text>

  <!-- Date badge -->
  <rect x="70" y="508" width="308" height="54" rx="27" fill="#FFFFFF" stroke="#E0E6F2" stroke-width="2" filter="url(#shadowSoft)"/>
  <circle cx="92" cy="535" r="7" fill="#A5D549"/>
  <text x="112" y="541" font-family="Arial" font-size="20" font-weight="700" fill="#5057EA">UPDATED SEP 2026</text>
  <text x="1070" y="588" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#C3CCD9">MY VISA ASSISTANCE</text>

  <!-- Visual: tropical island -->
  <g filter="url(#shadow)">
    <rect x="700" y="112" width="430" height="406" rx="36" fill="#FFFFFF"/>
  </g>

  <!-- Sun -->
  <circle cx="790" cy="195" r="52" fill="#F97316" opacity="0.3"/>

  <!-- Island base -->
  <ellipse cx="905" cy="468" rx="195" ry="24" fill="#F97316" opacity="0.18"/>

  <!-- Palm trunk -->
  <path d="M905 325 C 900 380 882 430 855 468" fill="none" stroke="#E86020" stroke-width="20" stroke-linecap="round"/>

  <!-- Palm fronds -->
  <path d="M900 322 C 948 296 1002 302 1028 342" fill="none" stroke="#A5D549" stroke-width="16" stroke-linecap="round"/>
  <path d="M900 322 C 952 330 1008 350 1022 395" fill="none" stroke="#A5D549" stroke-width="16" stroke-linecap="round"/>
  <path d="M900 322 C 852 298 806 306 782 344" fill="none" stroke="#A5D549" stroke-width="16" stroke-linecap="round"/>
  <path d="M900 322 C 848 332 800 352 784 398" fill="none" stroke="#A5D549" stroke-width="16" stroke-linecap="round"/>
  <path d="M900 322 C 905 280 915 272 922 306" fill="none" stroke="#A5D549" stroke-width="16" stroke-linecap="round"/>

  <!-- Frond accents -->
  <path d="M900 322 C 948 296 1002 302 1028 342" fill="none" stroke="#F97316" stroke-width="6" opacity="0.8" stroke-linecap="round"/>
  <path d="M900 322 C 848 332 800 352 784 398" fill="none" stroke="#F97316" stroke-width="6" opacity="0.8" stroke-linecap="round"/>

  <!-- Coconuts -->
  <circle cx="892" cy="332" r="11" fill="#031B30"/>
  <circle cx="914" cy="334" r="11" fill="#031B30"/>

  <!-- Waves -->
  <path d="M740 432 Q 810 408 880 432 T 1020 432" fill="none" stroke="#5057EA" stroke-width="8" opacity="0.45" stroke-linecap="round"/>
  <path d="M765 462 Q 835 438 905 462 T 1045 462" fill="none" stroke="#F97316" stroke-width="7" opacity="0.45" stroke-linecap="round"/>

  <!-- Birds -->
  <path d="M795 260 C 802 255 809 255 816 260" fill="none" stroke="#031B30" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M822 245 C 828 241 834 241 840 245" fill="none" stroke="#031B30" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>

</svg>