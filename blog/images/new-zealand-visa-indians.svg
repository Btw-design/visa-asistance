<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFD"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="0" r="320" fill="#5057EA" opacity="0.04"/>
  <circle cx="1200" cy="630" r="340" fill="#0284C7" opacity="0.05"/>
  <circle cx="1180" cy="40" r="14" fill="#A5D549" opacity="0.7"/>
  <circle cx="60" cy="580" r="10" fill="#5057EA" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#0284C7"/>

  <!-- Brand tag -->
  <rect x="70" y="64" width="168" height="40" rx="20" fill="#E86020"/>
  <text x="154" y="89" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">TRAVEL GUIDE</text>

  <text x="70" y="90" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#9AA6B2">BLOG &bull;</text>

  <!-- Title -->
  <text x="70" y="196" font-family="Arial" font-size="52" font-weight="800" fill="#031B30">New Zealand</text>
  <text x="70" y="282" font-family="Arial" font-size="52" font-weight="800" fill="#0284C7">Tourist Visa</text>

  <!-- Subtitle -->
  <text x="70" y="352" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Step-by-Step Application</text>
  <text x="70" y="390" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Guide for Indians</text>

  <!-- Date badge -->
  <rect x="70" y="508" width="308" height="54" rx="27" fill="#FFFFFF" stroke="#E0E6F2" stroke-width="2" filter="url(#shadowSoft)"/>
  <circle cx="92" cy="535" r="7" fill="#A5D549"/>
  <text x="112" y="541" font-family="Arial" font-size="20" font-weight="700" fill="#5057EA">UPDATED SEP 2026</text>
  <text x="1070" y="588" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#C3CCD9">MY VISA ASSISTANCE</text>

  <!-- Visual: mountain landscape -->
  <g filter="url(#shadow)">
    <rect x="700" y="112" width="430" height="406" rx="36" fill="#FFFFFF"/>
  </g>

  <!-- Sun -->
  <circle cx="1032" cy="168" r="46" fill="#E86020" opacity="0.55"/>

  <!-- Back mountain -->
  <path d="M735 490 L865 235 L995 490 Z" fill="#031B30" opacity="0.15"/>

  <!-- Mid mountain + snow cap -->
  <path d="M780 490 L915 175 L1050 490 Z" fill="#0284C7" opacity="0.42"/>
  <path d="M890 192 L915 175 L941 196 L936 222 L920 214 L907 224 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Front mountain + snow cap -->
  <path d="M830 490 L960 285 L1090 490 Z" fill="#0C4A6E" opacity="0.55"/>
  <path d="M935 305 L960 285 L985 305 L980 324 L968 316 L956 326 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Alpine tree silhouettes -->
  <path d="M768 478 L762 458 L774 458 Z" fill="#031B30" opacity="0.4"/>
  <path d="M777 478 L773 466 L781 466 Z" fill="#031B30" opacity="0.35"/>
  <path d="M1036 474 L1029 452 L1043 452 Z" fill="#031B30" opacity="0.45"/>
  <path d="M1048 476 L1043 460 L1053 460 Z" fill="#031B30" opacity="0.35"/>

  <!-- Glacial lake -->
  <rect x="730" y="460" width="370" height="40" rx="18" fill="#0284C7" opacity="0.22"/>

  <!-- Birds -->
  <path d="M870 160 C 877 155 884 155 891 160" fill="none" stroke="#031B30" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M905 142 C 911 138 917 138 923 142" fill="none" stroke="#031B30" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>

</svg>