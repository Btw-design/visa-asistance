<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFD"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="0" r="320" fill="#5057EA" opacity="0.04"/>
  <circle cx="1200" cy="630" r="340" fill="#1E3A5F" opacity="0.06"/>
  <circle cx="1180" cy="40" r="14" fill="#A5D549" opacity="0.7"/>
  <circle cx="60" cy="580" r="10" fill="#5057EA" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#1E3A5F"/>

  <!-- Brand tag -->
  <rect x="70" y="64" width="168" height="40" rx="20" fill="#E86020"/>
  <text x="154" y="89" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">TRAVEL GUIDE</text>

  <text x="70" y="90" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#9AA6B2">BLOG &bull;</text>

  <!-- Title -->
  <text x="70" y="196" font-family="Arial" font-size="52" font-weight="800" fill="#031B30">France Schengen Visa</text>
  <text x="70" y="282" font-family="Arial" font-size="52" font-weight="800" fill="#1E3A5F">Rejection Reasons</text>

  <!-- Subtitle -->
  <text x="70" y="352" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Top 7 Reasons for Rejection</text>
  <text x="70" y="390" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">&amp; How to Avoid Them</text>

  <!-- Date badge -->
  <rect x="70" y="508" width="308" height="54" rx="27" fill="#FFFFFF" stroke="#E0E6F2" stroke-width="2" filter="url(#shadowSoft)"/>
  <circle cx="92" cy="535" r="7" fill="#A5D549"/>
  <text x="112" y="541" font-family="Arial" font-size="20" font-weight="700" fill="#5057EA">UPDATED SEP 2026</text>
  <text x="1070" y="588" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#C3CCD9">MY VISA ASSISTANCE</text>

  <!-- Visual: warning shield -->
  <g filter="url(#shadow)">
    <rect x="700" y="112" width="430" height="406" rx="36" fill="#FFFFFF"/>
  </g>

  <!-- Warning crosses -->
  <line x1="738" y1="140" x2="762" y2="164" stroke="#E86020" stroke-width="8" stroke-linecap="round"/>
  <line x1="762" y1="140" x2="738" y2="164" stroke="#E86020" stroke-width="8" stroke-linecap="round"/>
  <line x1="1068" y1="140" x2="1092" y2="164" stroke="#E86020" stroke-width="8" stroke-linecap="round"/>
  <line x1="1092" y1="140" x2="1068" y2="164" stroke="#E86020" stroke-width="8" stroke-linecap="round"/>

  <!-- Shield -->
  <path d="M915 150 L1045 195 L1045 300 C1045 372 992 428 915 460 C838 428 785 372 785 300 L785 195 Z"
        fill="#FFFFFF" stroke="#1E3A5F" stroke-width="8" stroke-linejoin="round"/>
  <path d="M915 164 L1033 206 L1033 300 C1033 363 986 414 915 443 C844 414 797 363 797 300 L797 206 Z"
        fill="#F4F7FC" stroke="#1E3A5F" stroke-width="2.5" stroke-dasharray="10 7" stroke-linejoin="round"/>

  <!-- Alert icon -->
  <circle cx="915" cy="262" r="58" fill="#E86020"/>
  <text x="915" y="297" text-anchor="middle" font-family="Arial" font-size="76" font-weight="900" fill="#FFFFFF">!</text>

  <!-- Rejected text -->
  <text x="915" y="356" text-anchor="middle" font-family="Arial" font-size="46" font-weight="900" fill="#1E3A5F" letter-spacing="3">REJECTED</text>
  <text x="915" y="412" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1E3A5F" opacity="0.65">TOP 7 REASONS</text>

</svg>