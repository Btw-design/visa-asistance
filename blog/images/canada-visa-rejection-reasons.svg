<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFD"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="0" r="320" fill="#5057EA" opacity="0.04"/>
  <circle cx="1200" cy="630" r="340" fill="#DC2626" opacity="0.05"/>
  <circle cx="1180" cy="40" r="14" fill="#A5D549" opacity="0.7"/>
  <circle cx="60" cy="580" r="10" fill="#5057EA" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#DC2626"/>

  <!-- Brand tag -->
  <rect x="70" y="64" width="168" height="40" rx="20" fill="#E86020"/>
  <text x="154" y="89" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">TRAVEL GUIDE</text>

  <text x="70" y="90" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#9AA6B2">BLOG &bull;</text>

  <!-- Title -->
  <text x="70" y="196" font-family="Arial" font-size="52" font-weight="800" fill="#031B30">Canada Tourist Visa</text>
  <text x="70" y="282" font-family="Arial" font-size="52" font-weight="800" fill="#DC2626">Rejection Reasons 2026</text>

  <!-- Subtitle -->
  <text x="70" y="352" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">Why Applications Get Denied</text>
  <text x="70" y="390" font-family="Arial" font-size="27" font-weight="600" fill="#5A6B7B">&amp; How to Fix It</text>

  <!-- Date badge -->
  <rect x="70" y="508" width="308" height="54" rx="27" fill="#FFFFFF" stroke="#E0E6F2" stroke-width="2" filter="url(#shadowSoft)"/>
  <circle cx="92" cy="535" r="7" fill="#A5D549"/>
  <text x="112" y="541" font-family="Arial" font-size="20" font-weight="700" fill="#5057EA">UPDATED SEP 2026</text>
  <text x="1070" y="588" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#C3CCD9">MY VISA ASSISTANCE</text>

  <!-- Visual: rejection stamp -->
  <g filter="url(#shadow)">
    <rect x="700" y="112" width="430" height="406" rx="36" fill="#FFFFFF"/>
  </g>

  <line x1="738" y1="140" x2="1092" y2="490" stroke="#F3C5C0" stroke-width="24" stroke-linecap="round"/>
  <line x1="1092" y1="140" x2="738" y2="490" stroke="#F3C5C0" stroke-width="24" stroke-linecap="round"/>

  <g transform="rotate(-8 915 315)">
    <rect x="755" y="230" width="320" height="170" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="9"/>
    <rect x="767" y="242" width="296" height="146" rx="11" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="915" y="310" text-anchor="middle" font-family="Arial" font-size="56" font-weight="900" fill="#DC2626" letter-spacing="4">REJECTED</text>
    <text x="915" y="372" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#DC2626">APPLICATION 2026</text>
  </g>

</svg>